[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# La rama "data" solo guarda JSON (manifest, contadores): nunca debe construir.
[context.branch-deploy]
  command = "echo 'Rama sin build (solo datos)'"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Sin reglas de redirect propias: el plugin de Next.js genera las suyas y
# cualquier catch-all aquí tiene prioridad sobre ellas, lo que rompería las
# rutas de la app y /api/*. Los redirects de la app viven en next.config.js.
